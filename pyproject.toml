[tool.poetry]
name = "nba-ml-project"
version = "0.1.0"
description = "NBA fantasy points prediction machine learning project"
authors = ["Ziv <ziv@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
scikit-learn = ">=1.4.0"
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"
ipykernel = ">=6.29.0"
kagglehub = ">=1.0.1"
xgboost = ">=2.0.0"
lightgbm = ">=4.3.0"
catboost = ">=1.2.7"
tqdm = ">=4.66.0"
pyarrow = ">=24.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
